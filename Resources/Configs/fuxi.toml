#
# fuxi (Xiaomi 13, SM8550) — build_uefi.py device config
#
# Modeled on Resources/Configs/sheng.toml from UniXNU/uefi-sheng. The values
# that differ are marked WHY, because each one was measured rather than copied.
#
# Read by build_uefi.py: it compiles BootShim with these FD values, appends the
# shim to the firmware volume, gzips the pair, appends the device tree, and
# passes the result to Resources/Scripts/mkbootimg.py.
#

#
# Boot Shim Configs
#
# 1 = emit the ARM64 image header in front of the shim. The stock ABL verifies
# that header before jumping (see the UniXNU overview), so it stays on.
[boot_shim]
requires_kernel_header = true

#
# UEFI FD Configs
#
# Source: this device's own `uefiplatLA.cfg`, extracted from xbl_config_a:
#     0xA7100000, 0x00300000, "UEFI FD"
# The adjacent 1 MiB at 0xA7000000 is "FD Reserved", not part of this FD.
# Keep these values consistent with fuxiPkg/Library/MemoryMapLib; validate_pkg.py
# checks that agreement. This is the captured fuxi layout, not a cross-device
# rule for other SM8550 boards.
[uefi_fd]
base = 0xA7100000
size = 0x300000

#
# Android Boot Image Kernel Configs
#
# gzip: BootShim + firmware volume, exactly as the UniXNU overview describes.
# append_dtb: packs the tree after gzip inside the kernel field. On the audited
# Xiaomi v3/v4 ABL path, vendor_boot/DTBO supply the primary handoff tree;
# appended bytes alone do not identify x0. See docs/fuxi-abl-handoff.md.
# Container layout: the device tree goes after the gzip stream, inside the kernel
# field. BootShim/MemoryMapLib both expect it there.
[boot_image_kernel]
kernel_compression = "gzip"
append_dtb         = true

#
# Android Boot Image Configs
#
# Current bring-up profile: header v3, following the qrd8550 reference.
# This is a configuration choice, not proof of successful fuxi execution.
# The 2026-10-21 ad4b4dd3...43c0cfa test did not produce UEFI logs: it showed
# a bootloader warning and b was later reported unbootable with a active.
# Do not use "Booting OKAY" alone as evidence of ABL/UEFI compatibility.
#
# UniXNU's generic guide and verifier currently use v0. Changing the device
# profile to v0 needs explicit load-address/bootloader evidence and a separate
# hardware test; this audit does not silently change the shipping profile.
# With v3 the base/kernel_offset/tags_offset/pagesize header fields do not exist.
[boot_image]
header_version = 3
