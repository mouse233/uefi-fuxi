name: fuxi-static-checks

on:
  workflow_dispatch:
  push:
    paths:
      - 'Platforms/Xiaomi/fuxiPkg/**'
      - 'Resources/Configs/fuxi.toml'
      - 'tools/**'
      - 'BootShim/**'
      - 'build_uefi.py'
      - '.github/workflows/copy-test.yml'
  pull_request:
    paths:
      - 'Platforms/Xiaomi/fuxiPkg/**'
      - 'Resources/Configs/fuxi.toml'
      - 'tools/**'
      - 'BootShim/**'
      - 'build_uefi.py'
      - '.github/workflows/copy-test.yml'

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/validate_pkg.py .
      - run: python3 -m unittest discover -s tools/tests -p 'test_*.py' -v


  stage-marker-simulation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install offline simulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm python3-venv
          python3 -m venv /tmp/fuxi-marker-tests
          /tmp/fuxi-marker-tests/bin/pip install unicorn==2.1.4 capstone==5.0.9 coloredlogs==15.0.1
          command -v clang llvm-objcopy llvm-nm
      - name: Execute shim with synthetic memory only
        env:
          FUXI_REQUIRE_MARKER_TESTS: '1'
        run: /tmp/fuxi-marker-tests/bin/python -m unittest discover -s tools/tests -p test_boot_shim_markers.py -v
