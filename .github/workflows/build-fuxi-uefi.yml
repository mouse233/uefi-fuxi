name: build-fuxi-uefi

# Builds the Xiaomi 13 (fuxi) boot image from this repository.
#
# This repo is a fork of UniXNU/uefi-sheng: it already carries build_uefi.py,
# BootShim/, Resources/ and the Mu/Silicium submodules. The fuxi package lives
# in Platforms/Xiaomi/fuxiPkg and its config in Resources/Configs/fuxi.toml.
#
# Pipeline inside build_uefi.py:
#   BootShim (FD_BASE/FD_SIZE) + SILICIUM_UEFI.fd -> gzip -> + fuxi.dtb
#   -> Resources/Scripts/mkbootimg.py --header_version 3
#
# Ubuntu is enough: edk2's AARCH64 CLANGPDB build does not need macOS.
# macOS is only required for the XNU kernel stage (xcodebuild + iphoneos SDK).

on:
  workflow_dispatch:
  push:
    paths:
      - 'Platforms/Xiaomi/fuxiPkg/**'
      - 'Resources/Configs/fuxi.toml'
      - 'Resources/DTBs/fuxi.dtb'
      - 'Resources/Scripts/**'
      - 'Silicon/**'
      - 'Common/**'
      - 'Mu_Basecore'
      - 'Silicium-ACPI'
      - 'BootShim/**'
      - 'tools/**'
      - 'build_uefi.py'
      - 'setup_env.sh'
      - 'pip-requirements.txt'
      - '.gitmodules'
      - '.github/workflows/build-fuxi-uefi.yml'
  pull_request:
    paths:
      - 'Platforms/Xiaomi/fuxiPkg/**'
      - 'Resources/Configs/fuxi.toml'
      - 'Resources/DTBs/fuxi.dtb'
      - 'Resources/Scripts/**'
      - 'Silicon/**'
      - 'Common/**'
      - 'Mu_Basecore'
      - 'Silicium-ACPI'
      - 'BootShim/**'
      - 'tools/**'
      - 'build_uefi.py'
      - 'setup_env.sh'
      - 'pip-requirements.txt'
      - '.gitmodules'
      - '.github/workflows/build-fuxi-uefi.yml'

env:
  UNIXNU_REPO: https://github.com/UniXNU/UniXNU

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Binaries/ is deliberately skipped: FUXI_VENDOR_HW = 0 builds without
      # the vendor blob import, and it is several hundred MB.
      - name: Fetch submodules
        run: |
          git submodule update --init --depth 1 \
            Common/Mu \
            Common/Mu_OEM_Sample \
            Mu_Basecore \
            Silicium-ACPI \
            Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl

          # DEC [Includes] also names MipiSysT, SPDM and unit-test headers.
          # Initialize all direct Mu children, but not their own test trees.
          git -C Mu_Basecore submodule update --init --depth 1 --jobs 8

      - name: Static pre-flight
        run: |
          python3 tools/validate_pkg.py .
          python3 -m unittest discover -s tools/tests -p 'test_*.py' -v
          bash tools/test_sec_fdt_range.sh

      - name: Install toolchain
        run: ./setup_env.sh -p apt

      - name: Build
        env:
          UNIXNU_ROOT: ${{ github.workspace }}/UniXNU
          DARWINBOOT_REPO: https://github.com/UniXNU/DarwinBoot
        run: |
          # UniXNUPkg comes from package/, DarwinBootPkg from drivers/DarwinBoot.
          git clone --depth 1 "$UNIXNU_REPO" "$UNIXNU_ROOT"
          mkdir -p "$UNIXNU_ROOT/drivers"
          git clone --depth 1 "$DARWINBOOT_REPO" "$UNIXNU_ROOT/drivers/DarwinBoot"
          set -o pipefail
          ./build_uefi.py -d fuxi -r DEBUG -c 2>&1 | tee build-fuxi-debug.log

      - name: Inspect and record result
        run: |
          python3 tools/mkbootimg_v3.py info --image Mu-fuxi.img
          python3 tools/record_fuxi_build.py --output BuildEvidence

      - uses: actions/upload-artifact@v4
        with:
          name: fuxi-boot-image
          path: |
            Mu-fuxi*.img
            Build/fuxiPkg/DEBUG_CLANGPDB/FV/SILICIUM_UEFI.fd
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuxi-build-evidence
          path: |
            build-fuxi-debug.log
            BuildEvidence/
          if-no-files-found: warn
